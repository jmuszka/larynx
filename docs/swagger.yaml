basePath: /api/v1
definitions:
  blog.article:
    properties:
      content:
        type: string
      description:
        type: string
      modified:
        type: string
      published:
        type: string
      slug:
        type: string
      title:
        type: string
    type: object
  blog.articleSummary:
    properties:
      description:
        type: string
      modified:
        type: string
      published:
        type: string
      slug:
        type: string
      title:
        type: string
    type: object
  blog.articlesResponse:
    properties:
      articles:
        items:
          $ref: '#/definitions/blog.articleSummary'
        type: array
    type: object
  blog.createArticleRequest:
    properties:
      content:
        type: string
      description:
        type: string
      title:
        type: string
    type: object
  blog.createArticleResponse:
    properties:
      message:
        type: string
      slug:
        type: string
    type: object
  blog.messageResponse:
    properties:
      message:
        type: string
    type: object
  blog.updateArticleRequest:
    properties:
      content:
        type: string
      description:
        type: string
      title:
        type: string
    type: object
  endpoints.Feature:
    properties:
      geometry:
        additionalProperties: {}
        type: object
      properties:
        additionalProperties: {}
        type: object
      type:
        example: Feature
        type: string
    type: object
  endpoints.GeoJSON:
    properties:
      features:
        items:
          $ref: '#/definitions/endpoints.Feature'
        type: array
      type:
        example: FeatureCollection
        type: string
    type: object
  geography.geographyResponse:
    properties:
      geojson:
        $ref: '#/definitions/endpoints.GeoJSON'
    type: object
  health.healthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      version:
        type: string
    type: object
  words.etymologyResponse:
    properties:
      familyTree:
        $ref: '#/definitions/words.familyNode'
      geojson:
        $ref: '#/definitions/words.geoJSONCollection'
      graph:
        $ref: '#/definitions/words.graphResponse'
      ipa: {}
    type: object
  words.familyNode:
    properties:
      children:
        items:
          $ref: '#/definitions/words.familyNode'
        type: array
      glottocode:
        type: string
      id:
        type: string
      name:
        type: string
      value:
        type: integer
    type: object
  words.geoFeature:
    properties:
      properties:
        additionalProperties: {}
        type: object
      type:
        type: string
    type: object
  words.geoJSONCollection:
    properties:
      features:
        items:
          $ref: '#/definitions/words.geoFeature'
        type: array
      type:
        type: string
    type: object
  words.graphResponse:
    properties:
      head:
        additionalProperties: {}
        type: object
      paths:
        items:
          $ref: '#/definitions/words.pathRecord'
        type: array
    type: object
  words.historyResponse:
    properties:
      history:
        type: string
      word:
        type: string
    type: object
  words.pathRecord:
    properties:
      tail:
        additionalProperties: {}
        type: object
    type: object
info:
  contact: {}
  description: Larynx word etymology and language API.
  title: Larynx API
  version: preview
paths:
  /blog/articles:
    get:
      description: Returns all articles ordered by most recently modified.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/blog.articlesResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List articles
      tags:
      - blog
  /blog/articles/{slug}:
    delete:
      description: Deletes the article identified by its slug.
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/blog.messageResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - AdminJWTAuth: []
      summary: Delete an article
      tags:
      - blog
    get:
      description: Returns a single article identified by its slug.
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/blog.article'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an article by slug
      tags:
      - blog
    patch:
      consumes:
      - application/json
      description: Updates one or more fields of the article identified by its slug.
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/blog.updateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/blog.messageResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - AdminJWTAuth: []
      summary: Update an article
      tags:
      - blog
  /blog/articles/create:
    post:
      consumes:
      - application/json
      description: Creates a new article from the provided title, description, and
        content.
      parameters:
      - description: Article to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/blog.createArticleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/blog.createArticleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - AdminJWTAuth: []
      summary: Create an article
      tags:
      - blog
  /geography/{id}:
    get:
      description: Returns a GeoJSON FeatureCollection for every Geography node whose
        name matches the id.
      parameters:
      - description: The geography name to look up
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geography.geographyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get geography by name
      tags:
      - geography
  /health:
    get:
      description: Returns the server version and the status of its services.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/health.healthResponse'
      security:
      - BearerAuth: []
      summary: Health check
      tags:
      - health
  /words:
    get:
      description: Returns English words whose term starts with the given prefix.
      parameters:
      - description: Prefix to search for
        in: query
        name: prefix
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search for words
      tags:
      - words
  /words/{word}/etymology:
    get:
      description: Returns the graph of ancestor words, their language families, and
        a GeoJSON map of where those languages are spoken.
      parameters:
      - description: The word to look up
        in: path
        name: word
        required: true
        type: string
      - default: English
        description: Language of the word
        in: query
        name: lang
        type: string
      - default: "true"
        description: Include geojson in the response
        in: query
        name: geojson
        type: string
      - default: "true"
        description: Include the language family tree in the response
        in: query
        name: family
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/words.etymologyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a word's etymology graph
      tags:
      - words
  /words/{word}/history:
    get:
      description: Returns a one-sentence summary of a word's origin and history.
      parameters:
      - description: The word to look up
        in: path
        name: word
        required: true
        type: string
      - default: English
        description: Language of the word
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/words.historyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a word's origin and history
      tags:
      - words
securityDefinitions:
  AdminJWTAuth:
    description: Admin JWT for blog write endpoints (create/update/delete)
    in: header
    name: X-Admin-JWT
    type: apiKey
  BearerAuth:
    description: 'Client bearer token. Enter the full value as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
